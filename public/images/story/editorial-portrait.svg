  <rect x="48" y="48" width="1104" height="1404" fill="none" stroke="#D6B77A" stroke-opacity="0.35"/>
  <rect x="68" y="68" width="1064" height="1364" fill="none" stroke="#D6B77A" stroke-opacity="0.18"/>
