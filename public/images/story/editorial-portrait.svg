      <stop offset="0%" stop-color="#3A1422"/>
      <stop offset="55%" stop-color="#260D16"/>
      <stop offset="100%" stop-color="#14060C"/>
    </linearGradient>
    <radialGradient id="storyGlow" cx="48%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D6B77A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D6B77A" stop-opacity="0"/>
